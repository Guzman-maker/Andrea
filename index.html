  <!-- Supabase JS: carga principal y respaldo para navegadores/redes que bloqueen un CDN -->
  <script>
    window.__supabaseSdkReady = new Promise((resolve, reject) => {
      const cdns = [
        "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js",
        "https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"
      ];
      let index = 0;
      const loadNext = () => {
        if (window.supabase && typeof window.supabase.createClient === "function") {
          resolve(window.supabase);
          return;
        }
        if (index >= cdns.length) {
          reject(new Error("No se pudo cargar la biblioteca de conexión de Supabase. Comprueba tu conexión a internet o prueba desde GitHub Pages."));
          return;
        }
        const script = document.createElement("script");
        script.src = cdns[index++];
        script.async = true;
        script.onload = () => {
          if (window.supabase && typeof window.supabase.createClient === "function") {
            resolve(window.supabase);
          } else {
            loadNext();
          }
        };
        script.onerror = loadNext;
        document.head.appendChild(script);
      };
      loadNext();
    });
  </script>

    // APP PRINCIPAL

        (async () => {

            const { data, error } = await supabase.auth.getSession();
            if (error) throw error;
            if (!activo) return;

            const { data: listener } = supabase.auth.onAuthStateChange((_event, session) => {

              setRole(null);
              setMensajeAuth("No se pudo iniciar la conexión: " + (err?.message || "revisa tu conexión a internet."));
            }
          } finally {
            if (activo) setAuthCargando(false);
          }
        })();

        return () => {
          activo = false;
          if (suscripcion) suscripcion.unsubscribe();
        };

            const { error } = await supabase.auth.signInWithPassword({ email, password: passwordAcceso });

          }

          setMensajeAuth(err.message || "No se pudo completar el acceso.");
        } finally { setAuthCargando(false); }

      const cerrarSesion = async () => {

      // Datos base del cliente (Nota #23 Julio 2026)

        telefono: "753 112 41 64",

        fechaVenta: "23 Julio 2026"

      const [metodoPago, setMetodoPago] = useState("Tarjeta de Débito/Crédito");

      const [vistaPreviaLocal, setVistaPreviaLocal] = useState(null);

      const [modalImagen, setModalImagen] = useState(null);

      useEffect(() => {
        if (!usuario || !supabase) return;
        cargarAbonos();
        const channel = supabase.channel('pagos-andrea-' + usuario.id)
          .on('postgres_changes', { event: '*', schema: 'public', table: 'pagos' }, () => cargarAbonos())
          .subscribe();
        return () => { supabase.removeChannel(channel); };
      }, [usuario]);

      const cargarAbonos = async () => {
        if (!supabase || !usuario) return;
        setCargando(true);
        try {
          const { data, error } = await supabase.from('pagos').select('*').order('creado_en', { ascending: false });
          if (error) throw error;
          const conImagenes = await Promise.all((data || []).map(async (p) => {
            let url = null;
            if (p.comprobante_path) {
              const { data: signed } = await supabase.storage.from('comprobantes').createSignedUrl(p.comprobante_path, 3600);
              url = signed?.signedUrl || null;
            }
            return { ...p, comprobante_url: url, dia: p.dia || (p.creado_en ? new Date(p.creado_en).toLocaleDateString('es-MX',{day:'2-digit'}) : ''), mes: p.mes || (p.creado_en ? new Date(p.creado_en).toLocaleDateString('es-MX',{month:'long'}) : '') };

          setAbonos(conImagenes);

      const handleSeleccionarArchivo = (e) => {
        const file = e.target.files[0];
        if (file) {

          reader.onloadend = () => setVistaPreviaLocal(reader.result);
          reader.readAsDataURL(file);

      // Registrar comprobante: solo el cliente autenticado puede enviar pagos pendientes.

        e.preventDefault();
        if (!usuario || role !== 'cliente') return;
        if (!nuevoMonto || Number(nuevoMonto) <= 0) { mostrarNotif("Ingresa un monto válido", "error"); return; }

        if (!['image/jpeg','image/png','image/webp'].includes(archivoComprobante.type)) { mostrarNotif("Solo se permiten imágenes JPG, PNG o WEBP.", "error"); return; }
        if (archivoComprobante.size > 10 * 1024 * 1024) { mostrarNotif("La imagen no debe superar 10 MB.", "error"); return; }
        setSubiendo(true);
        try {
          const ext = archivoComprobante.name.split('.').pop().toLowerCase().replace(/[^a-z0-9]/g,'') || 'jpg';
          const ruta = `${usuario.id}/${Date.now()}_${crypto.randomUUID()}.${ext}`;
          const { error: uploadError } = await supabase.storage.from('comprobantes').upload(ruta, archivoComprobante, { contentType: archivoComprobante.type, upsert: false });
          if (uploadError) throw uploadError;
          const fecha = new Date();
          const meses = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];

            user_id: usuario.id, dia: String(fecha.getDate()).padStart(2,'0'), mes: meses[fecha.getMonth()],

          });
          if (error) {
            await supabase.storage.from('comprobantes').remove([ruta]);
            throw error;
          }
          mostrarNotif("Comprobante enviado. Está pendiente de revisión.", "exito");
          setArchivoComprobante(null); setVistaPreviaLocal(null); setNuevoMonto("300");
          await cargarAbonos();
        } catch (err) {
          console.error(err);
          mostrarNotif(err.message || "No se pudo enviar el comprobante.", "error");
        } finally { setSubiendo(false); }
      };

      // La función SQL valida el correo administrador; el navegador no decide permisos.
      const handleAprobarPago = async (id) => {
        try {
          const { error } = await supabase.rpc('revisar_pago', { p_pago_id: id, p_estado: 'aprobado', p_nota: null });
          if (error) throw error;
          mostrarNotif("Pago aprobado. El saldo se actualizará.", "exito");
          await cargarAbonos();
        } catch (err) { mostrarNotif(err.message || "No se pudo aprobar el pago.", "error"); }

      const handleRechazarPago = async (id) => {
        try {
          const { error } = await supabase.rpc('revisar_pago', { p_pago_id: id, p_estado: 'rechazado', p_nota: 'Comprobante rechazado por administración' });
          if (error) throw error;
          mostrarNotif("Comprobante rechazado. Se conserva en el historial.", "info");
          await cargarAbonos();
        } catch (err) { mostrarNotif(err.message || "No se pudo rechazar el pago.", "error"); }

      const mostrarNotif = (msg, tipo) => {

      if (authCargando) return <div className="min-h-screen bg-slate-950 text-white flex items-center justify-center">Verificando acceso seguro...</div>;
      if (!usuario) return (
        <div className="min-h-screen bg-slate-950 text-slate-100 flex items-center justify-center p-4">

            </div>
            {!supabase && <p className="mb-4 text-sm text-rose-300 bg-rose-500/10 border border-rose-500/20 rounded-lg p-3">No se pudo cargar el servicio de acceso. {supabaseInitError?.message || "Comprueba internet y recarga la página."}</p>}
            <form onSubmit={entrarCuenta} className="space-y-4">

              <div><label className="block text-sm text-slate-300 mb-1">Contraseña</label><input type="password" required minLength="6" value={passwordAcceso} onChange={e=>setPasswordAcceso(e.target.value)} autoComplete={modoRegistro ? "new-password" : "current-password"} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white outline-none focus:border-blue-500" placeholder="Tu contraseña" /></div>
              {mensajeAuth && <p className="text-sm text-amber-300 bg-amber-500/10 border border-amber-500/20 rounded-lg p-3">{mensajeAuth}</p>}

            <div className="max-w-6xl mx-auto px-4 py-3 flex flex-col sm:flex-row items-center justify-between gap-4">

                      </span>
                    ) : (
                      <span className="inline-flex items-center gap-1 text-[10px] bg-slate-800 text-slate-400 border border-slate-700 px-2 py-0.5 rounded-full font-semibold">
                        Modo Local
                      </span>
                    )}
                  </div>
                </div>
              </div>

              <div className="flex items-center gap-3 w-full sm:w-auto justify-between">
                <div className="text-right min-w-0">
                  <p className="text-xs text-slate-400">Sesión activa</p>
                  <p className="text-sm text-white font-semibold truncate max-w-[190px]">{usuario.email}</p>
                  <p className="text-[10px] text-blue-300">{role === 'dueno' ? 'Administrador' : 'Cliente'}</p>
                </div>
                <button onClick={cerrarSesion} className="px-3 py-2 rounded-lg text-xs font-bold border border-slate-700 text-slate-300 hover:bg-slate-800">Cerrar sesión</button>
              </div>
            </div>
          </header>

          {/* MAIN CONTAINER */}
          <main className="max-w-6xl mx-auto px-4 mt-6">

            {/* VISTA CLIENTE */}
            {role === 'cliente' && (
              <div className="space-y-6">
                
                {/* Banner de Bienvenida y Progreso */}
                <div className="bg-gradient-to-br from-slate-900 via-slate-900 to-blue-950 rounded-2xl p-6 border border-slate-800 shadow-xl relative overflow-hidden">
                  <div className="flex flex-col md:flex-row md:items-center justify-between gap-6 relative z-10">
                    <div className="flex items-start gap-4">
                      <div className="bg-white p-2 rounded-2xl shadow-lg shrink-0 hidden sm:block">
                        <LogoDistribuidoraAndrea className="w-14 h-14" />
                      </div>
                      <div>
                        <span className="inline-block px-3 py-1 rounded-full bg-blue-500/10 border border-blue-500/20 text-blue-400 text-xs font-semibold mb-2">
                          Estado de Cuenta Actualizado
                        </span>
                        <h2 className="text-2xl font-bold text-white">{cliente.nombre}</h2>
                        <div className="flex flex-wrap gap-x-4 gap-y-1 text-xs text-slate-400 mt-1">
                          <span><strong className="text-slate-300">Domicilio:</strong> {cliente.domicilio}, {cliente.poblacion}</span>
                          <span><strong className="text-slate-300">Teléfono:</strong> {cliente.telefono}</span>
                        </div>
                      </div>
                    </div>

                    <div className="bg-slate-950/80 border border-slate-800 p-4 rounded-xl flex items-center gap-4">
                      <div className="relative w-16 h-16 flex items-center justify-center">
                        <svg className="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
                          <path className="text-slate-800" strokeWidth="3.5" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                          <path className="text-blue-500 stroke-current" strokeDasharray={`${porcentajePagado}, 100`} strokeWidth="3.5" strokeLinecap="round" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                        </svg>
                        <span className="absolute text-sm font-extrabold text-blue-400">{porcentajePagado}%</span>
                      </div>
                      <div>
                        <p className="text-xs text-slate-400">Progreso de Pago</p>
                        <p className="text-sm font-semibold text-white">${totalAbonado.toLocaleString('es-MX')} abonados</p>
                        <p className="text-xs text-slate-400">de ${cliente.montoTotal.toLocaleString('es-MX')}</p>
                      </div>
                    </div>
                  </div>
                </div>

                {/* Tarjetas Informativas */}
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl shadow-lg">
                    <p className="text-xs text-slate-400 font-medium">Artículo Adquirido</p>
                    <h3 className="text-lg font-bold text-white mt-1">{cliente.articulo}</h3>
                    <p className="text-xs text-blue-400 font-medium mt-1">Modalidad: {cliente.formaPago}</p>
                  </div>

                  <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl shadow-lg">
                    <p className="text-xs text-slate-400 font-medium">Costo Total del Equipo</p>
                    <h3 className="text-xl font-extrabold text-emerald-400 mt-1">${cliente.montoTotal.toLocaleString('es-MX')}</h3>
                    <p className="text-xs text-slate-500 mt-1">Precio acordado en nota</p>
                  </div>

                  <div className="bg-gradient-to-br from-blue-950/40 to-indigo-950/40 border border-blue-500/30 p-5 rounded-2xl shadow-lg">
                    <p className="text-xs text-blue-300 font-bold uppercase tracking-wider">SALDO FALTANTE</p>
                    <h3 className="text-2xl font-black text-rose-400 mt-1">${saldoFaltante.toLocaleString('es-MX')}</h3>
                    <p className="text-xs text-slate-300 mt-1">Pendiente por liquidar</p>
                  </div>
                </div>

                {/* Formulario de Subida de Comprobante */}
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
                  <h3 className="text-lg font-bold text-white mb-1 flex items-center gap-2">
                    Registrar nuevo abono
                  </h3>
                  <p className="text-xs text-slate-400 mb-6">Sube la foto del ticket o captura de pantalla de tu transferencia o pago con tarjeta.</p>

                  <form onSubmit={handleEnviarComprobante} className="space-y-4">
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs font-medium text-slate-300 mb-1">Monto Abonado ($ MXN)</label>
                        <input 
                          type="number"
                          value={nuevoMonto}
                          onChange={(e) => setNuevoMonto(e.target.value)}
                          className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-blue-500 text-sm font-semibold"
                          placeholder="300"
                          required
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-medium text-slate-300 mb-1">Método de Pago</label>
                        <select
                          value={metodoPago}
                          onChange={(e) => setMetodoPago(e.target.value)}
                          className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-blue-500 text-sm"
                        >
                          <option value="Tarjeta de Débito/Crédito">Tarjeta de Débito / Crédito</option>
                          <option value="Transferencia SPEI">Transferencia Bancaria SPEI</option>
                          <option value="Depósito OXXO/Ventanilla">Depósito OXXO / Ventanilla</option>
                        </select>
                      </div>
                    </div>

                    {/* Selector de Foto */}
                    <div>
                      <label className="block text-xs font-medium text-slate-300 mb-1">Foto o Captura del Comprobante</label>
                      <div className="border-2 border-dashed border-slate-800 hover:border-blue-500/50 rounded-xl p-4 transition-all text-center bg-slate-950/50">
                        <input 
                          type="file" 
                          accept="image/*"
                          onChange={handleSeleccionarArchivo}
                          className="hidden" 
                          id="comprobante-input"
                        />
                        <label htmlFor="comprobante-input" className="cursor-pointer flex flex-col items-center justify-center gap-2">
                          {vistaPreviaLocal ? (
                            <div className="relative">
                              <img 
                                src={vistaPreviaLocal} 
                                alt="Vista previa" 
                                className="max-h-40 rounded-lg object-contain border border-slate-700 shadow-md"
                              />
                              <span className="text-xs text-blue-400 mt-2 block font-medium">Clic para cambiar imagen</span>
                            </div>
                          ) : (
                            <>
                              <span className="text-sm font-semibold text-blue-400">Adjuntar comprobante</span>
                              <span className="text-sm font-medium text-slate-200">Haz clic aquí para adjuntar tu comprobante</span>
                              <span className="text-xs text-slate-500">Formatos permitidos: JPG, PNG, WEBP</span>
                            </>
                          )}
                        </label>
                      </div>
                    </div>

                    <button
                      type="submit"
                      disabled={subiendo}
                      className="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold py-3 rounded-xl shadow-lg shadow-blue-600/20 transition-all flex items-center justify-center gap-2 disabled:opacity-50"
                    >
                      {subiendo ? "Subiendo Comprobante..." : "Enviar Comprobante al Dueño"}
                    </button>
                  </form>
                </div>

                {/* Tabla de Abonos del Cliente */}
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
                  <h3 className="text-lg font-bold text-white mb-4">Historial de pagos y abonos</h3>
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs text-slate-300">
                      <thead className="bg-slate-950 text-slate-400 uppercase font-semibold border-b border-slate-800">
                        <tr>
                          <th className="py-3 px-4">Fecha y hora</th>
                          <th className="py-3 px-4">Método / Detalle</th>
                          <th className="py-3 px-4 text-right">Abono</th>
                          <th className="py-3 px-4 text-center">Estado</th>
                          <th className="py-3 px-4 text-center">Comprobante</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800">
                        {abonos.map((item) => (
                          <tr key={item.id} className="hover:bg-slate-800/40">
                            <td className="py-3 px-4 font-medium text-white whitespace-nowrap">{item.creado_en ? new Date(item.creado_en).toLocaleString('es-MX') : `${item.dia} de ${item.mes}`}</td>
                            <td className="py-3 px-4">{item.metodo || 'Efectivo / Mostrador'}</td>
                            <td className="py-3 px-4 text-right font-bold text-emerald-400">${Number(item.monto).toLocaleString('es-MX')}</td>
                            <td className="py-3 px-4 text-center">
                              {item.estatus === 'aprobado' ? (
                                <span className="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-[11px] font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                                  Aprobado
                                </span>
                              ) : item.estatus === 'rechazado' ? (
                                <span className="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-[11px] font-semibold bg-rose-500/10 text-rose-400 border border-rose-500/20">Rechazado</span>
                              ) : (
                                <span className="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-[11px] font-semibold bg-amber-500/10 text-amber-400 border border-amber-500/20">En revisión</span>
                              )}
                            </td>
                            <td className="py-3 px-4 text-center">
                              {item.comprobante_url ? (
                                <button
                                  onClick={() => setModalImagen(item.comprobante_url)}
                                  className="text-blue-400 hover:text-blue-300 font-semibold underline"
                                >
                                  Ver Foto
                                </button>
                              ) : (
                                <span className="text-slate-500">Recibo Físico</span>
                              )}
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>

              </div>
            )}

            {/* VISTA DUEÑO / ADMINISTRADOR */}
            {role === 'dueno' && (
              <div className="space-y-6">
                
                {/* FICHA COMPLETA DEL CLIENTE */}
                <div className="bg-gradient-to-br from-slate-900 via-slate-900 to-indigo-950 rounded-2xl p-6 border border-slate-800 shadow-xl">
                  <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-6">
                    <div className="flex items-start gap-4">
                      <div className="bg-white p-2 rounded-2xl shadow-lg shrink-0 hidden sm:block">
                        <LogoDistribuidoraAndrea className="w-14 h-14" />
                      </div>
                      <div>
                        <span className="inline-block px-3 py-1 rounded-full bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 text-xs font-semibold mb-2">
                          👤 Expediente Activo de Cliente
                        </span>
                        <h2 className="text-2xl font-bold text-white">{cliente.nombre}</h2>
                        
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-x-6 gap-y-2 text-xs text-slate-300 mt-3">
                          <span>📍 <strong>Domicilio:</strong> {cliente.domicilio}, {cliente.poblacion}</span>
                          <span>📞 <strong>Teléfono:</strong> {cliente.telefono}</span>
                          <span>📺 <strong>Artículo:</strong> {cliente.articulo} ({cliente.formaPago})</span>
                          <span>📅 <strong>Fecha Venta:</strong> {cliente.fechaVenta}</span>
                        </div>
                      </div>
                    </div>

                    <div className="bg-slate-950/80 border border-slate-800 p-4 rounded-xl flex flex-wrap sm:flex-nowrap items-center gap-4 justify-between lg:justify-end">
                      <div>
                        <p className="text-xs text-slate-400">Total Venta</p>
                        <p className="text-base font-bold text-white">${cliente.montoTotal.toLocaleString('es-MX')}</p>
                      </div>
                      <div className="h-8 w-px bg-slate-800 hidden sm:block"></div>
                      <div>
                        <p className="text-xs text-slate-400">Total Abonado</p>
                        <p className="text-base font-bold text-emerald-400">${totalAbonado.toLocaleString('es-MX')}</p>
                      </div>
                      <div className="h-8 w-px bg-slate-800 hidden sm:block"></div>
                      <div>
                        <p className="text-xs text-slate-400">Saldo Restante</p>
                        <p className="text-base font-bold text-rose-400">${saldoFaltante.toLocaleString('es-MX')}</p>
                      </div>
                    </div>
                  </div>
                </div>

                {/* Métricas Generales */}
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                  <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl shadow-lg">
                    <p className="text-xs text-slate-400 font-medium">Total Cobrado Verificado</p>
                    <h3 className="text-2xl font-black text-emerald-400 mt-1">${totalAbonado.toLocaleString('es-MX')}</h3>
                  </div>

                  <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl shadow-lg">
                    <p className="text-xs text-slate-400 font-medium">Saldo Restante por Cobrar</p>
                    <h3 className="text-2xl font-black text-rose-400 mt-1">${saldoFaltante.toLocaleString('es-MX')}</h3>
                  </div>

                  <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl shadow-lg">
                    <p className="text-xs text-slate-400 font-medium">Comprobantes por Validar</p>
                    <h3 className="text-2xl font-black text-amber-400 mt-1">{pendientes.length}</h3>
                  </div>
                </div>

                {/* Bandeja de Verificación de Comprobantes */}
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
                  <h3 className="text-lg font-bold text-white mb-4 flex items-center gap-2">
                    ⏳ Comprobantes de Pago Pendientes por Validar
                  </h3>

                  {pendientes.length === 0 ? (
                    <div className="text-center py-8 border border-dashed border-slate-800 rounded-xl bg-slate-950/40">
                      <p className="text-slate-300 font-medium">No hay comprobantes pendientes de pago.</p>
                      <p className="text-xs text-slate-500">Todos los abonos enviados han sido procesados.</p>
                    </div>
                  ) : (
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      {pendientes.map((item) => (
                        <div key={item.id} className="bg-slate-950 border border-slate-800 rounded-xl p-4 flex flex-col justify-between gap-4">
                          <div className="flex gap-4">
                            {item.comprobante_url && (
                              <img 
                                src={item.comprobante_url} 
                                alt="Comprobante" 
                                className="w-24 h-24 object-cover rounded-lg border border-slate-800 cursor-pointer shrink-0"
                                onClick={() => setModalImagen(item.comprobante_url)}
                              />
                            )}
                            <div>
                              <span className="text-xs text-slate-400 font-medium">Cliente: {cliente.nombre}</span>
                              <h4 className="text-xl font-bold text-emerald-400">${Number(item.monto).toLocaleString('es-MX')}</h4>
                              <p className="text-xs text-slate-300 mt-1">Fecha y hora: {item.creado_en ? new Date(item.creado_en).toLocaleString('es-MX') : `${item.dia} de ${item.mes}`}</p>
                              <p className="text-xs text-blue-400 font-medium">Método: {item.metodo}</p>
                            </div>
                          </div>

                          <div className="flex gap-2 border-t border-slate-800 pt-3">
                            <button
                              onClick={() => handleAprobarPago(item.id)}
                              className="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 rounded-lg text-xs shadow-md"
                            >
                              ✓ Aprobar y Descontar Saldo
                            </button>
                            <button
                              onClick={() => handleRechazarPago(item.id)}
                              className="px-3 bg-rose-950 hover:bg-rose-900 text-rose-300 border border-rose-800 font-bold py-2 rounded-lg text-xs"
                            >
                              ✕ Rechazar
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                {/* Tabla de Control de Abonos Registrados */}
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
                  <h3 className="text-lg font-bold text-white mb-4">📋 Historial Completo de Abonos</h3>

                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs text-slate-300">
                      <thead className="bg-slate-950 text-slate-400 uppercase font-semibold border-b border-slate-800">
                        <tr>
                          <th className="py-3 px-4">Día</th>
                          <th className="py-3 px-4">Mes</th>
                          <th className="py-3 px-4">Fecha y hora</th>
                          <th className="py-3 px-4 text-right">Abono</th>
                          <th className="py-3 px-4">Firma / Recibió</th>
                          <th className="py-3 px-4 text-center">Estado</th>
                          <th className="py-3 px-4 text-center">Comprobante</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800">
                        {abonos.map((item) => (
                          <tr key={item.id} className="hover:bg-slate-800/40">
                            <td className="py-3 px-4 font-bold text-white">{item.dia}</td>
                            <td className="py-3 px-4">{item.mes}</td>
                            <td className="py-3 px-4 text-slate-400 whitespace-nowrap">{item.creado_en ? new Date(item.creado_en).toLocaleString('es-MX') : 'Registro histórico'}</td>
                            <td className="py-3 px-4 text-right font-extrabold text-emerald-400">${Number(item.monto).toLocaleString('es-MX')}</td>
                            <td className="py-3 px-4 text-slate-400">{item.recibio}</td>
                            <td className="py-3 px-4 text-center">
                              {item.estatus === 'aprobado' ? (
                                <span className="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-[11px] font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                                  Aprobado
                                </span>
                              ) : item.estatus === 'rechazado' ? (
                                <span className="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-[11px] font-semibold bg-rose-500/10 text-rose-400 border border-rose-500/20">Rechazado</span>
                              ) : (
                                <span className="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-[11px] font-semibold bg-amber-500/10 text-amber-400 border border-amber-500/20">Pendiente</span>
                              )}
                            </td>
                            <td className="py-3 px-4 text-center">
                              {item.comprobante_url ? (
                                <button
                                  onClick={() => setModalImagen(item.comprobante_url)}
                                  className="text-blue-400 hover:text-blue-300 font-semibold underline"
                                >
                                  Ver Imagen
                                </button>
                              ) : (
                                <span className="text-slate-500">Recibo Físico</span>
                              )}
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>

              </div>
            )}

          </main>

          {/* MODAL PARA VER COMPROBANTE EN TAMAÑO COMPLETO */}
          {modalImagen && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="relative max-w-2xl w-full bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-2xl">
                <button 
                  onClick={() => setModalImagen(null)}
                  className="absolute top-3 right-3 bg-slate-800 text-slate-300 hover:text-white px-3 py-1 rounded-full text-xs font-bold border border-slate-700"
                >
                  ✕ Cerrar
                </button>
                <h4 className="text-sm font-bold text-white mb-3">Foto del Comprobante de Pago</h4>
                <div className="flex justify-center">
                  <img src={modalImagen} alt="Comprobante ampliado" className="max-h-[75vh] object-contain rounded-xl border border-slate-800" />
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Renderizar la aplicación React
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
